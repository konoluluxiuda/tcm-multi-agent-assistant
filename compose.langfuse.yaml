name: tcm-langfuse

x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: "3"}

x-runtime: &runtime
  DATABASE_URL: postgresql://langfuse:${LF_POSTGRES_PASSWORD:?Run setup_langfuse_local first}@postgres:5432/langfuse
  NEXTAUTH_URL: http://localhost:${LF_PORT:-3037}
  SALT: ${LF_SALT:?}
  ENCRYPTION_KEY: ${LF_ENCRYPTION_KEY:?}
  TELEMETRY_ENABLED: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: langfuse
  CLICKHOUSE_PASSWORD: ${LF_CLICKHOUSE_PASSWORD:?}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${LF_REDIS_PASSWORD:?}
  REDIS_TLS_ENABLED: "false"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LF_MINIO_PASSWORD:?}
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LF_MINIO_PASSWORD:?}
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/

x-dependencies: &dependencies
  postgres: {condition: service_healthy}
  redis: {condition: service_healthy}
  clickhouse: {condition: service_healthy}
  minio: {condition: service_healthy}

services:
  web:
    image: langfuse/langfuse:4.72.0@sha256:c311fd9db4b69f6514fdcb1b86a2a105d5a4ed51fbf0ded033ff2722459c804a
    logging: *logging
    restart: unless-stopped
    depends_on: *dependencies
    ports: ["127.0.0.1:${LF_PORT:-3037}:3000"]
    environment:
      <<: *runtime
      NEXTAUTH_SECRET: ${LF_NEXTAUTH_SECRET:?}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:${LF_MEDIA_PORT:-3038}
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://minio:9000
      LANGFUSE_INIT_ORG_ID: tcm-local
      LANGFUSE_INIT_ORG_NAME: TCM DataOps
      LANGFUSE_INIT_PROJECT_ID: tcm-dataops
      LANGFUSE_INIT_PROJECT_NAME: TCM DataOps
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LF_PUBLIC_KEY:?}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LF_SECRET_KEY:?}
      LANGFUSE_INIT_USER_EMAIL: ${LF_USER_EMAIL:?}
      LANGFUSE_INIT_USER_NAME: 8n1eld
      LANGFUSE_INIT_USER_PASSWORD: ${LF_USER_PASSWORD:?}
      LANGFUSE_IN_APP_AGENT_ENABLED: "false"
    mem_limit: 1536m
  worker:
    image: langfuse/langfuse-worker:4.72.0@sha256:aa1724b989a00f1e4ca9930709202489c73deaaf2f1116bbd3d71c77edb8fedb
    logging: *logging
    restart: unless-stopped
    depends_on: *dependencies
    environment: *runtime
    mem_limit: 1536m
  postgres:
    image: postgres:17@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f
    logging: *logging
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_DB: langfuse
      POSTGRES_PASSWORD: ${LF_POSTGRES_PASSWORD:?}
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 1024m
  redis:
    image: redis:7@sha256:b6b6e3dc0c0952737748e55d5d885272840c7e42ba41ab1d5489f693419882f5
    logging: *logging
    restart: unless-stopped
    environment: {REDIS_PASSWORD: "${LF_REDIS_PASSWORD:?}"}
    command: [redis-server, --requirepass, "${LF_REDIS_PASSWORD:?}", --maxmemory-policy, noeviction]
    volumes: ["redis:/data"]
    healthcheck:
      test: [CMD-SHELL, 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
  clickhouse:
    image: clickhouse/clickhouse-server:25.12@sha256:8a790dd3468db22b1d4e7b18a176f378ff5ff6053b9c48dd4ea1fa71a24c5ba6
    logging: *logging
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${LF_CLICKHOUSE_PASSWORD:?}
    volumes: ["clickhouse:/var/lib/clickhouse", "clickhouse-logs:/var/log/clickhouse-server"]
    healthcheck:
      test: [CMD-SHELL, "wget --quiet --spider http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 3072m
  minio:
    image: cgr.dev/chainguard/minio@sha256:3b6e40c30ecd5cea627e382ff0b82ca841f58c52294578787043ee80c8ef7c82
    logging: *logging
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: langfuse
      MINIO_ROOT_PASSWORD: ${LF_MINIO_PASSWORD:?}
    ports: ["127.0.0.1:${LF_MEDIA_PORT:-3038}:9000"]
    volumes: ["minio:/data"]
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 384m

volumes:
  postgres:
  redis:
  clickhouse:
  clickhouse-logs:
  minio:
