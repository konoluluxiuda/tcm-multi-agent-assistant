name: Offline regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-tcm.txt
      - name: Install regression dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run offline regressions (skips fail)
        run: python -m scripts.run_offline_ci
      - name: Keep reports and per-module logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-regression-${{ github.sha }}
          path: var/ci/
          if-no-files-found: warn
