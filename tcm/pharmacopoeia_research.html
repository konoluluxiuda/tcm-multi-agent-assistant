<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self';script-src 'unsafe-inline';style-src 'unsafe-inline';img-src 'self';connect-src 'self'">
<title>药典自动质检与研究检索</title>
<style>body{font:16px/1.6 sans-serif;max-width:1050px;margin:24px auto;padding:0 16px;background:#f5f7f9;color:#1c3040}section,article{background:#fff;border:1px solid #ccd5de;border-radius:8px;margin:16px 0;padding:18px}input,select,button{font:inherit;padding:6px;margin:5px;max-width:90%}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}code{overflow-wrap:anywhere}img{max-width:100%}summary{cursor:pointer}.notice{color:#954017}</style>
<h1>药典自动质检与研究检索</h1><p class="notice">机器检查通过 ≠ 人工审核通过。仅展示未审核的来源片段，不生成诊疗或用药结论；未命中不表示原书没有记载。</p>
<section><p id="batch">读取批次…</p><form id="query"><label>关键词<input id="q" placeholder="例如：丁公藤、孕妇、干燥"></label><label>药材<select id="herb"><option value="">全部</option></select></label><label>字段<select id="field"><option value="">全部</option></select></label><button id="search" disabled>检索来源</button></form><p id="status" role="status"></p></section>
<div id="results"></div><section><h2>异常复核队列</h2><p>这里只列出需要复核的字段；没有候选的注意项可保持未知，不必强行补写。</p><div id="queue"></div></section><section><h2>一致字段的分层抽样</h2><p>按来源和字段类型抽取，种子固定，可复现。抽样不等于全部已审核。</p><div id="samples"></div></section>
<script>
const byId=id=>document.getElementById(id),labels={origin:'来源',medicinal_part:'药用部位',pinyin:'拼音',latin_drug_name:'拉丁药材名',properties_meridians:'性味归经',efficacy_indications:'功能主治',usage:'用法用量',cautions:'注意',storage:'贮藏'};
const reasons={engine_disagreement:'双引擎文字差异',mixed_script_in_latin_word:'拉丁词中混入其他文字',low_model_confidence:'模型分数偏低',numeric_disagreement:'数字差异',negation_or_caution_disagreement:'否定词或注意用语差异',manual_region_end:'字段止于选定区域末尾',single_terminal_full_stop_difference:'仅末尾中文句号差异'};
let batch,serial=0;
function add(parent,tag,text){const element=document.createElement(tag);element.textContent=text;parent.append(element);return element;}
function sources(parent,previews){const box=add(parent,'details','');add(box,'summary','展开原图与出处');for(const p of previews){add(box,'p',(batch.documents[p.document]?.path||p.document)+' · PDF第'+p.pdf_page+'页 · 印刷第'+p.printed_page+'页');add(box,'code','SHA-256: '+p.source_sha256);if(/^assets\/[A-Za-z0-9_-]+\.png$/.test(p.image)){const im=document.createElement('img');im.src='/'+p.image;im.alt='原始扫描页裁剪，保留双方证据框';im.loading='lazy';box.append(im);}}}
function card(parent,f){const article=add(parent,'article','');article.dataset.id=f.id;add(article,'h3',f.name_zh_candidate+' · '+labels[f.field]);add(article,'p','机器状态：'+f.machine_status+'；人工审核：'+f.human_review+'；仅研究预览。');return article;}
async function lookup(event){event?.preventDefault();const turn=++serial;byId('results').replaceChildren();byId('status').textContent='检索中…';try{const params=new URLSearchParams({q:byId('q').value,herb:byId('herb').value,field:byId('field').value});const response=await fetch('/api/search?'+params);const result=await response.json();if(turn!==serial)return;if(!response.ok)throw Error(result.error||'检索失败');byId('status').textContent='找到'+result.total+'条可预览来源，当前显示'+result.results.length+'条；人工审核仍未完成。';for(const f of result.results){const article=card(byId('results'),f);add(article,'pre',f.excerpt);sources(article,f.previews);}if(!result.results.length)add(byId('results'),'p','没有符合条件的可预览片段。可能在异常队列中，或该区域未提取到，不能推断为无相关信息。');}catch(error){if(turn===serial){byId('results').replaceChildren();byId('status').textContent=error.message;}}}
byId('query').addEventListener('submit',lookup);
fetch('/api/quality').then(async r=>{const value=await r.json();if(!r.ok)throw Error(value.error);return value;}).then(data=>{batch=data;const s=data.summary;byId('batch').textContent='字段'+s.field_slots+'个；机器检查通过'+(s.machine_status_counts.machine_checks_passed||0)+'个；未提取到'+(s.machine_status_counts.not_available||0)+'个；异常复核'+s.review_queue_count+'个；抽样'+s.sample_count+'个；人工批准0个。';for(const [key,label] of Object.entries(labels)){const o=add(byId('field'),'option',label);o.value=key;}const herbs=new Map(data.fields.map(f=>[f.case_id,f.name_zh_candidate]));for(const [key,name] of herbs){const o=add(byId('herb'),'option',name);o.value=key;}for(const id of data.review_queue){const f=data.fields.find(v=>v.id===id),article=card(byId('queue'),f);add(article,'p',f.review_priority+' · '+f.reasons.map(r=>reasons[r]||r).join('；'));const details=add(article,'details','');add(details,'summary','查看双方原始候选');for(const [engine,value] of Object.entries(f.alternatives)){add(details,'h4',engine);for(const o of value.occurrences)add(details,'pre',o.raw_text);}sources(article,f.previews);}for(const id of data.stratified_samples){const f=data.fields.find(v=>v.id===id),article=card(byId('samples'),f);add(article,'p','抽样层：'+f.sampling_group);add(article,'pre',f.excerpt);sources(article,f.previews);}byId('search').disabled=false;byId('status').textContent='输入关键词或选择药材/字段，检索仅覆盖机器检查通过的片段。';}).catch(error=>{byId('batch').textContent='读取失败：'+error.message;});
</script></html>
