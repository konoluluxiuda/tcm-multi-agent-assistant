<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>引用资料回答</title><style>
body{font:16px/1.7 system-ui,sans-serif;color:#20303d;background:#f5f7f9;max-width:960px;margin:36px auto;padding:0 20px}main{background:white;padding:28px;border-radius:16px}a{color:#17645c}textarea{box-sizing:border-box;width:100%;font:inherit;padding:12px;border:1px solid #bac8cf;border-radius:8px}button{font:inherit;padding:9px 18px;background:#17645c;color:white;border:0;border-radius:8px;cursor:pointer}button:disabled{opacity:.5}#answer{white-space:pre-wrap}details{margin-top:12px;padding:10px;background:#f3f6f7;border-radius:6px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.6 monospace}.note{color:#596d79;font-size:14px}#status{color:#17645c}
</style><main><a href="/">← 聊天</a> · <a href="/dataops">表格工作台</a><h1>引用资料回答</h1>
<p>查找资料，或比较多份原始记录。先给结果，出处按需展开。</p>
<textarea id="question" rows="3" maxlength="500">比较白术和黄芪的贮藏原文，指出共同用词，保留各自出处。</textarea>
<p><button id="original">查看原文</button> <button id="compose" disabled>整理引用回答</button></p>
<p class="note" id="mode">正在检查运行模式…</p><p id="status" role="status"></p><div id="answer"></div><div id="sources"></div>
<p class="note">药典资料未人工签核。共有用词不等于药效或对象身份相同；候选不代表全部相关条目。</p></main>
<script>
const byId=id=>document.getElementById(id);let pending=null;
fetch('/api/rag/capabilities').then(r=>r.json()).then(c=>{byId('compose').disabled=!c.generation_enabled;byId('mode').textContent=c.generation_enabled?'整理回答会发送当前问句及最多6条资料节选，每条最多800字；每次最多调用模型一次。':'当前仅查看原文，外部模型关闭。';}).catch(()=>byId('mode').textContent='运行模式读取失败，请刷新页面。');
async function run(compose){
 const question=byId('question').value.trim();if(!question)return;
 const body=pending&&pending.question===question&&pending.compose===compose?pending:{question,compose,request_key:crypto.randomUUID()};pending=body;
 byId('original').disabled=true;byId('compose').disabled=true;byId('status').textContent='正在检索'+(compose?'并整理引用…':'原文…');byId('answer').textContent='';byId('sources').replaceChildren();
 try{const response=await fetch('/api/rag/answers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await response.json();if(!response.ok)throw new Error(typeof data.detail==='string'?data.detail:'请求未完成');
 byId('answer').textContent=data.message;byId('status').textContent=data.status==='composed'?'已核对引用和摘录。':data.status==='original_fallback'?'整理未通过或证据不足，已保留原文。':data.status==='original'?'原文如下。':data.status==='clarification_required'?'需要明确查询范围。':'当前资料不足。';
 if(data.composition_note)byId('status').textContent+=' '+data.composition_note;
 if(data.status==='composed')byId('status').textContent+=` 原请求模型调用：${data.stats?.requests??'未知'}次${data.replayed?'（本次读取已有结果，未新增调用）':''}。`;
 for(const source of data.bundle?.sources||[]){const box=document.createElement('details'),title=document.createElement('summary'),text=document.createElement('pre');title.textContent='['+source.id+'] '+source.name+' · '+source.label+' · 出处';const loc=source.kind==='pdf_field'?source.provenance.evidence.map(e=>(e.source?.source_document||'PDF')+' 物理页 '+e.source?.source_pdf_page+' / '+e.block_id).join('\n'):source.provenance.relative_file_path+'\n'+source.provenance.json_pointer;text.textContent=source.text+'\n\n'+loc+'\n作用域：'+source.scope+(source.truncated?'（节选）':'');box.append(title,text);byId('sources').append(box);}
 }catch(e){byId('status').textContent=e.message+'。重复点击会核对同一请求状态，不会自动重发模型请求。';}
 finally{byId('original').disabled=false;fetch('/api/rag/capabilities').then(r=>r.json()).then(c=>byId('compose').disabled=!c.generation_enabled);}
}
byId('original').onclick=()=>run(false);byId('compose').onclick=()=>run(true);
</script></html>
